[package]
name = "uv-nix"
version = "0.0.1"
edition = "2024"

[dependencies]
anyhow = { version = "1" }
console = { version = "0.16", default-features = false, features = ["std"] }
rayon = { version = "1" }
owo-colors = { version = "4" }
# PEP 440 version parsing/matching for Python `requires-python` / `.python-version`.
# This is astral's published PEP 440 engine — the same code uv vendors as
# `uv_pep440` — so versions are interpreted exactly as uv interprets them. A
# crates.io dep (not uv's in-tree `uv-pep440`) because this crate must also
# compile standalone at the repo root, where a uv workspace dep can't resolve.
pep440_rs = { version = "0.7.3" }
semver = { version = "1" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
sha2 = { version = "0.10" }
toml = { version = ">=0.8" }
toml_edit = { version = ">=0.22" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", optional = true }
walkdir = { version = "2" }

[dev-dependencies]
tempfile = { version = "3" }
serde_json = { version = "1" }

[features]
default = []
cli = ["tracing-subscriber"]

[[bin]]
name = "generate_soname_map"
path = "src/bin/generate_soname_map.rs"
required-features = ["cli"]

[[test]]
name = "wheel_install"
path = "tests/wheel_install.rs"

[[test]]
name = "source_build"
path = "tests/source_build.rs"

[[test]]
name = "nixpkgs_python"
path = "tests/nixpkgs_python.rs"
